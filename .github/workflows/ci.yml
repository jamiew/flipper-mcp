name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest -v

      - name: Validate every bundled protocol JSON
        run: |
          for f in flipper_mcp/protocols/*.json; do
            uv run --no-sync flipper-registry validate "$f"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check flipper_mcp tests

      - name: Ruff format check
        run: uv run --no-sync ruff format --check flipper_mcp tests

      - name: Type check
        run: uv run --no-sync ty check
